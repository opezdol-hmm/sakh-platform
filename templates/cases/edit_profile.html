{% extends "base.html" %}

{% block content %}
<div class="edit-profile-page">
    <div class="page-header">
        <h1 class="page-title">Редактирование профиля</h1>
    </div>

    <form method="post" enctype="multipart/form-data" class="edit-profile-form">
        {% csrf_token %}

        <div class="form-section">
            <h2 class="section-title">📷 Аватар</h2>
            <div class="avatar-upload">
                {% if profile_obj.avatar %}
                    <img src="{{ profile_obj.avatar.url }}" alt="Текущий аватар" class="current-avatar">
                {% else %}
                    <div class="avatar-placeholder">
                        <span>{{ profile_obj.user.username|first|upper }}</span>
                    </div>
                {% endif %}
                <div class="avatar-upload-btn">
                    <label for="avatar-input" class="btn btn-outline">📁 Выбрать фото</label>
                    <input type="file" id="avatar-input" name="avatar" accept="image/*" style="display: none;">
                    <p class="avatar-hint">JPG, PNG до 5MB</p>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2 class="section-title">👤 Основная информация</h2>
            <div class="form-row">
                <div class="form-group">
                    <label for="first_name">Имя *</label>
                    <input type="text" id="first_name" name="first_name" value="{{ profile_obj.first_name }}" required>
                </div>
                <div class="form-group">
                    <label for="last_name">Фамилия</label>
                    <input type="text" id="last_name" name="last_name" value="{{ profile_obj.last_name }}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" value="{{ profile_obj.user.email }}" required>
                </div>
                <div class="form-group">
                    <label for="phone">Телефон</label>
                    <input type="tel" id="phone" name="phone" value="{{ profile_obj.phone }}" placeholder="+7 (999) 999-99-99">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="city">Город</label>
                    <input type="text" id="city" name="city" value="{{ profile_obj.city }}" placeholder="Южно-Сахалинск">
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2 class="section-title">📝 О себе</h2>
            <div class="form-group">
                <textarea id="bio" name="bio" rows="4" placeholder="Расскажите немного о себе...">{{ profile_obj.bio }}</textarea>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">💾 Сохранить изменения</button>
            <a href="{% url 'profile' %}" class="btn btn-outline">❌ Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
